name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project parts
        run: |
          for z in $(ls PakistanLaws-Part*.zip 2>/dev/null | sort -V); do
            echo "Unzipping $z"
            unzip -o "$z" -x ".github/*"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakistanLaws-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
