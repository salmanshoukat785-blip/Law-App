name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project parts
        run: |
          echo "Files in the repository root:"
          ls -la
          if ! ls PakistanLaws-Part*.zip >/dev/null 2>&1; then
            echo "ERROR: no PakistanLaws-Part*.zip files were found in the repository root."
            exit 1
          fi
          ls PakistanLaws-Part*.zip | sort -V | while IFS= read -r z; do
            echo "Unzipping: $z"
            unzip -o "$z" -x ".github/*"
          done
          if [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts is missing. A PakistanLaws-Part zip is missing or was renamed."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -eo pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show the errors
        if: failure()
        run: |
          echo "---- Compile errors (lines starting with e:) ----"
          grep -E "^e: " build.log | head -40 || true
          grep -E "^e: " build.log | head -8 | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "---- What went wrong ----"
          grep -A10 "What went wrong" build.log | head -30 || true
          grep -A6 "What went wrong" build.log | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakistanLaws-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
